[project]
name = "ragbucket"
version = "0.2.2"
description = "Portable executable RAG artifacts for Python"
readme = "README.md"
requires-python = ">=3.10"

authors = [
    { name = "Anik Chand" }
]

license = { text = "MIT" }

keywords = [
    "rag",
    "llm",
    "retrieval",
    "vector-db",
    "faiss",
    "groq",
    "ai",
    "machine-learning"
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "faiss-cpu",
    "numpy",
    "pydantic",
    "langchain-text-splitters>=1.1.2",
    "groq>=1.2.0",
    "python-dotenv>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["ragbucket"]

[dependency-groups]
dev = [
    "build>=1.5.0",
    "twine>=6.2.0",
]
